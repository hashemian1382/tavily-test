name: Tavily Bridge
on:
  workflow_dispatch:
    inputs:
      query:
        description: 'Search Query'
        required: true
jobs:
  proxy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Run Search
        env:
          TAVILY_API_KEY: "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"
        run: |
          curl -X POST https://api.tavily.com/search \
          -H "Content-Type: application/json" \
          -d "{\"api_key\": \"$TAVILY_API_KEY\", \"query\": \"${{ github.event.inputs.query }}\"}" > response.json
      - name: Commit result
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add response.json
          git commit -m "Results for: ${{ github.event.inputs.query }}"
          git push
